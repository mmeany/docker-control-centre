[package]
name = "docker-control-centre"
version = "0.1.0"
description = "Docker Control Centre"
edition = "2021"
rust-version = "1.85"

[lib]
name = "docker_control_centre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync", "fs", "io-util", "rt", "time", "process"] }
bollard = { version = "0.21", default-features = false, features = ["http", "pipe"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[features]
# Tests that need a running Docker engine.
integration = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
